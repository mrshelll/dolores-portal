<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>dolores</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/base.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <noscript><main class="frame"><p>Esta página necesita JavaScript.</p></main></noscript>
</div>
<script>
  // If the app could not load (offline, CDN down), say so instead of leaving a blank page. This text cannot live in
  // js/text.js: it shows exactly when no module loaded.
  setTimeout(function () {
    if (document.documentElement.dataset.ready === "true") return;
    var main = document.createElement("main");
    main.className = "frame fallback";
    var p = document.createElement("p");
    p.textContent = "No pudimos cargar la página. Revisa tu conexión y vuelve a intentarlo.";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "button button--primary";
    b.textContent = "Volver a cargar";
    b.onclick = function () { location.reload(); };
    main.append(p, b);
    document.getElementById("app").replaceChildren(main);
  }, 10000);
</script>
</body>
</html>
