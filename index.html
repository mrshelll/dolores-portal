<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tomoshi</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <noscript><main class="auth"><div class="auth-panel"><p class="brand-word auth-brand">tomoshi</p><p class="auth-text">Esta página necesita JavaScript.</p></div></main></noscript>
</div>
<script>
  // If the app could not load (offline, CDN down), say so instead of leaving a blank page, in the sign-in's panel. This
  // text cannot live in js/text.js: it shows exactly when no module loaded.
  setTimeout(function () {
    if (document.documentElement.dataset.ready === "true") return;
    var make = function (tag, className, text) {
      var el = document.createElement(tag);
      el.className = className;
      el.textContent = text;
      return el;
    };
    var b = make("button", "button button--primary", "Volver a cargar");
    b.type = "button";
    b.onclick = function () { location.reload(); };
    var panel = make("div", "auth-panel", "");
    panel.append(make("p", "brand-word auth-brand", "tomoshi"),
      make("p", "auth-text", "No pudimos cargar la página. Revisa tu conexión y vuelve a intentarlo."), b);
    var main = make("main", "auth", "");
    main.append(panel);
    document.getElementById("app").replaceChildren(main);
  }, 10000);
</script>
</body>
</html>
