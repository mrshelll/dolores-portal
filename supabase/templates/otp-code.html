<!-- tomoshi: the email with the sign-in code (Supabase Auth > Email Templates). The subject is in otp-code.subject.txt.
     Rules: COR-10 to COR-13 of the factory's visual manual (the code first, no links, no images). In the lab report's
     colours: the code first, in the report's ink (#14213D) on a near-white sheet (no pure white, COR-09), then its two
     sentences, and the report's blue band (#1F4E8C, the portal's masthead) that closes the email with the lowercase
     wordmark as near-white text. Public Sans when the reader has it, else Arial: no web font is loaded. Every text
     colour reaches WCAG AA on its own background. The line «Vale 1 hora.» must match «Email OTP expiration» in the
     panel; change it here if that setting is not 3600 seconds. -->
<div style="margin: 0; padding: 24px 16px; background-color: #E8EEF6;">
  <div style="max-width: 600px; margin: 0 auto; border: 1px solid #D5DCE6; background-color: #FBFCFE;">
    <div style="padding: 24px; background-color: #FBFCFE;">
      <p style="margin: 0 0 16px 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 2px; color: #14213D; background-color: #FBFCFE;">{{ .Token }}</p>
      <p style="margin: 0 0 8px 0; padding: 0; font-family: 'Public Sans', Arial, sans-serif; font-size: 16px; line-height: 24px; color: #14213D; background-color: #FBFCFE;">Este es tu código para entrar a tomoshi. Vale 1 hora.</p>
      <p style="margin: 0; padding: 0; font-family: 'Public Sans', Arial, sans-serif; font-size: 16px; line-height: 24px; color: #4A5568; background-color: #FBFCFE;">Si no lo pediste, ignora este correo.</p>
    </div>
    <p style="margin: 0; padding: 12px 24px; font-family: 'Public Sans', Arial, sans-serif; font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.2px; color: #FBFCFE; background-color: #1F4E8C;">tomoshi</p>
  </div>
</div>
