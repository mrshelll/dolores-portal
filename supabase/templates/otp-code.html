<!-- tomoshi: the email with the sign-in code (Supabase Auth > Email Templates). The subject is in otp-code.subject.txt.
     Rules: COR-10 to COR-13 of the factory's visual manual (the code first, no links, no images). In the board's colours:
     the code first, on the day board's panel, then its two sentences, and a dark band (#1A1C1E) under the amber lamp's
     line that closes the email with the lowercase wordmark as text. Every text colour reaches WCAG AA on its own
     background. The line «Vale 1 hora.» must match «Email OTP expiration» in the panel; change it here if that setting
     is not 3600 seconds. -->
<div style="margin: 0; padding: 24px 16px; background-color: #DCDEE0;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #F2F3F4;">
    <div style="padding: 24px; background-color: #F2F3F4;">
      <p style="margin: 0 0 16px 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: 2px; color: #1A1C1E; background-color: #F2F3F4;">{{ .Token }}</p>
      <p style="margin: 0 0 8px 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #1A1C1E; background-color: #F2F3F4;">Este es tu código para entrar a tomoshi. Vale 1 hora.</p>
      <p style="margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #4A4F55; background-color: #F2F3F4;">Si no lo pediste, ignora este correo.</p>
    </div>
    <p style="margin: 0; padding: 12px 24px; border-top: 4px solid #F2A900; font-family: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: 0.5px; color: #F4F4F2; background-color: #1A1C1E;">tomoshi</p>
  </div>
</div>
